<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends in AI</title>
<meta name="description" content="Trends in AI: a hub of interactive visualizations on chips, markets, geopolitics, research, robotics, energy, policy and work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060d; --bg-2:#081022; --ink:#e8f1ff; --ink-2:#9fb3d1; --ink-3:#62759a;
  --line:rgba(120,170,255,.16); --line-hi:rgba(120,200,255,.55);
  --cyan:#5ee7ff; --blue:#3d7bff; --indigo:#6a5cff;
  --card:rgba(12,22,44,.55);
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
/* ---------- ambient background ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{ /* glows */
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(40% 35% at 18% 12%, rgba(61,123,255,.22), transparent 70%),
    radial-gradient(35% 30% at 85% 20%, rgba(94,231,255,.13), transparent 70%),
    radial-gradient(50% 40% at 50% 110%, rgba(106,92,255,.18), transparent 70%);
  animation:drift 22s ease-in-out infinite alternate;
}
.bg::after{ /* perspective grid */
  content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:60%;
  background-image:
    linear-gradient(rgba(94,170,255,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,170,255,.10) 1px, transparent 1px);
  background-size:64px 64px;
  transform:perspective(600px) rotateX(62deg);
  transform-origin:bottom;
  mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 85%);
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 85%);
  animation:grid 14s linear infinite;
}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
@keyframes grid{to{background-position:0 64px,0 0}}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:56px 32px 40px;min-height:100%;display:flex;flex-direction:column}
header{margin-bottom:36px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 "Space Grotesk",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);opacity:0;animation:fadeUp .8s var(--ease) .1s forwards}
.eyebrow::before{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
h1{
  margin:14px 0 10px;font:700 clamp(44px,7vw,96px)/.95 "Space Grotesk",sans-serif;letter-spacing:-.035em;
  background:linear-gradient(100deg,#ffffff 0%,#bfe6ff 35%,var(--cyan) 60%,var(--blue) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:fadeUp 1s var(--ease) .2s forwards;
}
.lede{max-width:620px;color:var(--ink-2);font-size:16px;margin:0;opacity:0;animation:fadeUp 1s var(--ease) .35s forwards}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;flex:1}
.card{
  position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:300px;aspect-ratio:4/3.4;border-radius:18px;overflow:hidden;isolation:isolate;
  text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);
  opacity:0;transform:translateY(28px) scale(.97);filter:blur(6px);
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s;
}
.card.in{animation:cardIn .9s var(--ease) forwards}
@keyframes cardIn{to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* image + unified blue duotone treatment */
.card .img{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;
  filter:grayscale(1) contrast(1.2) brightness(1.15);transform:scale(1.06);transition:transform 1.2s var(--ease),filter .6s}
.card::before{ /* duotone: recolor every photo to the same blue, keeping its light and shadow */
  content:"";position:absolute;inset:0;z-index:-1;background:#2f7bff;mix-blend-mode:color;opacity:.95;
}
.card::after{ /* legibility gradient + scanlines + hover sheen */
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(4,8,20,.15) 0%,rgba(4,8,20,.05) 35%,rgba(4,10,28,.78) 72%,rgba(3,6,16,.95) 100%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
    linear-gradient(115deg,transparent 30%,rgba(140,220,255,.18) 48%,transparent 62%);
  background-size:auto,auto,250% 100%;background-position:0 0,0 0,120% 0;
  transition:background-position 1.1s var(--ease);
}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:var(--line-hi);
  box-shadow:0 0 0 1px rgba(94,231,255,.25),0 18px 50px -12px rgba(61,123,255,.55),inset 0 0 40px rgba(94,231,255,.08);outline:none}
.card:hover .img,.card:focus-visible .img{transform:scale(1.12);filter:grayscale(.4) contrast(1.15) brightness(1.25)}
.card:hover::after,.card:focus-visible::after{background-position:0 0,0 0,-30% 0}

/* corner brackets */
.br{position:absolute;width:12px;height:12px;border-color:rgba(94,231,255,.7);border-style:solid;opacity:.55;transition:opacity .4s,transform .5s var(--ease)}
.br.tl{top:10px;left:10px;border-width:1px 0 0 1px}
.br.tr{top:10px;right:10px;border-width:1px 1px 0 0}
.br.bl{bottom:10px;left:10px;border-width:0 0 1px 1px}
.br.brr{bottom:10px;right:10px;border-width:0 1px 1px 0}
.card:hover .br{opacity:1}
.card:hover .tl{transform:translate(-3px,-3px)} .card:hover .tr{transform:translate(3px,-3px)}
.card:hover .bl{transform:translate(-3px,3px)} .card:hover .brr{transform:translate(3px,3px)}

.meta{position:absolute;top:22px;left:26px;right:22px;display:flex;justify-content:space-between;align-items:center;
  font:500 12px/1 "Space Grotesk",sans-serif;letter-spacing:.16em;color:var(--ink-2)}
.num{color:var(--cyan)}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
  background:rgba(4,8,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.status.live{color:#d9fbff;border-color:rgba(94,231,255,.45)}
.status.live i{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

.body{padding:22px 26px 26px}
.card h2{margin:0 0 6px;font:600 22px/1.15 "Space Grotesk",sans-serif;letter-spacing:-.01em;color:#fff}
.card p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.45;max-width:34ch}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:500 12px/1 "Space Grotesk",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);
  opacity:.75;transition:opacity .3s,gap .4s var(--ease)}
.card:hover .go{opacity:1;gap:14px}

footer{margin-top:36px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;color:var(--ink-3);font-size:12px;opacity:0;animation:fadeUp .8s var(--ease) 1.9s forwards}
footer a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--cyan)}

@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))} .card{aspect-ratio:16/10}}
@media (max-width:640px){
  .wrap{padding:36px 16px 28px}
  .grid{grid-template-columns:1fr;gap:14px}
  .card{aspect-ratio:auto;min-height:220px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
  .card{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><canvas id="stars"></canvas></div>

<main class="wrap">
  <header>
    <div class="eyebrow">CS 1710 · Visualization hub</div>
    <h1>Trends in AI</h1>
    <p class="lede">Eight lenses on the AI industry, from the chips it runs on to the people it changes. Select a panel to open its visualization.</p>
  </header>

  <nav class="grid" id="grid" aria-label="Visualizations"></nav>

  <footer>
    <span>Placeholder photography from <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>: <span id="credits"></span>.</span>
    <span>Educational project · not investment advice</span>
  </footer>
</main>

<script>
/* ============================================================
   Edit this list to change a tile's title, blurb, image or link.
   status: "live" for finished visualizations, "soon" for placeholders.
   ============================================================ */
const TILES = [
  { title: "Compute: GPUs & TPUs", blurb: "Who designs and fabs the accelerators behind frontier AI, and how fast capability is scaling.",
    href: "coming-soon.html?topic=compute", status: "soon",
    img: "1782330300668-f85cb4d0fe6e", credit: "Brecht Corbeel" },
  { title: "Financial Markets", blurb: "How Nvidia, TSMC, Google and AMD shares move together around policy shocks and launches.",
    href: "chip-policy.html", status: "live",
    img: "1649003515353-c58a239cf662", credit: "Tötös Ádám" },
  { title: "US–China Tech Rivalry", blurb: "Export controls, tariffs and countermeasures, mapped against the companies caught in between.",
    href: "chip-policy.html", status: "live",
    img: "1634176866089-b633f4aec882", credit: "Anirudh" },
  { title: "Industry vs. Academia", blurb: "Who builds notable AI models, and how research has shifted from universities to labs.",
    href: "prototype-who-builds/index.html", status: "live",
    img: "1766297247924-6638d54e7c89", credit: "Chidera Faustina Okeke" },
  { title: "Humanoids & Robotics", blurb: "From research prototypes to factory pilots: the race to put AI into bodies.",
    href: "coming-soon.html?topic=robotics", status: "soon",
    img: "1666597107756-ef489e9f1f09", credit: "julien Tromeur" },
  { title: "Energy & Data Centers", blurb: "The power, water and real estate that AI training and inference demand.",
    href: "coming-soon.html?topic=energy", status: "soon",
    img: "1561233835-f937539b95b9", credit: "Krzysztof Kowalik" },
  { title: "Policy & Regulation", blurb: "AI laws, executive orders and safety frameworks across major jurisdictions.",
    href: "coming-soon.html?topic=policy", status: "soon",
    img: "1768839719921-6a554fb3e847", credit: "Sasun Bughdaryan" },
  { title: "Work & Talent", blurb: "Where AI talent goes, and which jobs and tasks are being reshaped.",
    href: "coming-soon.html?topic=work", status: "soon",
    img: "1560264280-88b68371db39", credit: "Arlington Research" },
];

const imgUrl = (id, w) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=72`;
const grid = document.getElementById("grid");
TILES.forEach((t, i) => {
  const a = document.createElement("a");
  a.className = "card"; a.href = t.href;
  a.setAttribute("aria-label", `${t.title}: ${t.status === "live" ? "open visualization" : "coming soon"}`);
  const img = document.createElement("div"); img.className = "img";
  img.style.backgroundImage = `url("${imgUrl(t.img, 900)}")`;
  a.appendChild(img);
  ["tl", "tr", "bl", "brr"].forEach((c) => { const s = document.createElement("span"); s.className = "br " + c; a.appendChild(s); });
  const meta = document.createElement("div"); meta.className = "meta";
  const num = document.createElement("span"); num.className = "num"; num.textContent = String(i + 1).padStart(2, "0");
  const st = document.createElement("span"); st.className = "status" + (t.status === "live" ? " live" : "");
  st.appendChild(document.createElement("i")); st.appendChild(document.createTextNode(t.status === "live" ? "Live" : "Coming soon"));
  meta.append(num, st); a.appendChild(meta);
  const body = document.createElement("div"); body.className = "body";
  const h = document.createElement("h2"); h.textContent = t.title;
  const p = document.createElement("p"); p.textContent = t.blurb;
  const go = document.createElement("span"); go.className = "go"; go.textContent = t.status === "live" ? "Explore →" : "Preview →";
  body.append(h, p, go); a.appendChild(body);
  grid.appendChild(a);
});
document.getElementById("credits").textContent = TILES.map((t) => t.credit).join(", ");

/* Reveal tiles one by one (row by row, left to right). Each waits briefly for its image. */
const cards = [...grid.children];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const loaded = (id) => new Promise((res) => { const im = new Image(); im.onload = im.onerror = res; im.src = imgUrl(id, 900); setTimeout(res, 1200); });
(async () => {
  await new Promise((r) => setTimeout(r, reduce ? 0 : 500));
  for (let i = 0; i < cards.length; i++) {
    await loaded(TILES[i].img);
    cards[i].classList.add("in");
    await new Promise((r) => setTimeout(r, reduce ? 0 : 180));
  }
})();

/* Subtle star/particle field */
(() => {
  const c = document.getElementById("stars"), ctx = c.getContext("2d");
  let W, H, pts = [];
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    pts = Array.from({ length: Math.round((innerWidth * innerHeight) / 9000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.2 + .3) * dpr,
      v: (Math.random() * .15 + .03) * dpr, a: Math.random() * .6 + .15, p: Math.random() * 6.28,
    }));
  };
  resize(); addEventListener("resize", resize);
  const tick = (t) => {
    ctx.clearRect(0, 0, W, H);
    for (const s of pts) {
      if (!reduce) { s.y -= s.v; if (s.y < 0) { s.y = H; s.x = Math.random() * W; } }
      ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(t / 1400 + s.p));
      ctx.fillStyle = "#9fdcff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
