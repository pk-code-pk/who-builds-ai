<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon · Trends in AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060d;--ink:#e8f1ff;--ink-2:#9fb3d1;--cyan:#5ee7ff;--blue:#3d7bff;--line:rgba(120,170,255,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(50% 40% at 30% 20%,rgba(61,123,255,.22),transparent 70%),radial-gradient(40% 35% at 80% 80%,rgba(94,231,255,.12),transparent 70%),var(--bg);
  color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.box{max-width:560px;text-align:center}
.eyebrow{font:500 12px/1 "Space Grotesk",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan)}
h1{margin:16px 0 12px;font:700 clamp(32px,6vw,56px)/1 "Space Grotesk",sans-serif;letter-spacing:-.03em;
  background:linear-gradient(100deg,#fff,#bfe6ff 40%,var(--cyan) 70%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--ink-2);margin:0 0 28px}
a{display:inline-flex;gap:8px;align-items:center;padding:10px 18px;border:1px solid var(--line);border-radius:999px;color:var(--cyan);text-decoration:none;
  font:500 12px/1 "Space Grotesk",sans-serif;letter-spacing:.18em;text-transform:uppercase;transition:border-color .3s,box-shadow .3s}
a:hover{border-color:rgba(94,231,255,.6);box-shadow:0 0 24px -6px rgba(94,231,255,.6)}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">Visualization in progress</div>
  <h1 id="t">Coming soon</h1>
  <p>This panel is a placeholder. The visualization for this topic hasn't been built yet.</p>
  <a href="index.html">← Back to Trends in AI</a>
</div>
<script>
const TOPICS = { compute: "Compute: GPUs & TPUs", robotics: "Humanoids & Robotics", energy: "Energy & Data Centers", policy: "Policy & Regulation", work: "Work & Talent" };
const k = new URLSearchParams(location.search).get("topic");
if (TOPICS[k]) { document.getElementById("t").textContent = TOPICS[k]; document.title = TOPICS[k] + " · Trends in AI"; }
</script>
</body>
</html>
